<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather App</title>
  <style>
    body {
      background: linear-gradient(to right, #4facfe, #00f2fe);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 2rem;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0px 4px 20px rgba(0,0,0,0.2);
    }
    h1 {
      margin-bottom: 1rem;
    }
    input {
      padding: 0.5rem;
      width: 200px;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      padding: 0.5rem 1rem;
      background-color: #4facfe;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #00c6ff;
    }
    #weatherResult {
      margin-top: 1.5rem;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Weather App</h1>
    <input type="text" id="locationInput" placeholder="Enter location">
    <button onclick="getWeather()">Get Weather</button>
    <div id="weatherResult"></div>
  </div>

  <script>
    function getWeather() {
      const location = document.getElementById('locationInput').value.trim();
      if (!location) {
        document.getElementById('weatherResult').innerHTML = "<span style='color:red;'>Please enter a location.</span>";
        return;
      }
      
      const apiKey = '64814b5c526b4f39820141535252704';
      const url = `http://api.weatherapi.com/v1/current.json?key=${apiKey}&q=${location}&aqi=yes`;

      fetch(url)
        .then(response => {
          if (!response.ok) {
            throw new Error('Location not found');
          }
          return response.json();
        })
        .then(data => {
          const temperature = data.current.temp_c;
          const condition = data.current.condition.text;
          const locationName = data.location.name;
          document.getElementById('weatherResult').innerHTML = 
            `🌍 Location: <b>${locationName}</b><br>🌡️ Temperature: <b>${temperature}°C</b><br>⛅ Condition: <b>${condition}</b>`;
        })
        .catch(error => {
          document.getElementById('weatherResult').innerHTML = `<span style="color:red;">${error.message}</span>`;
        });
    }
  </script>

</body>
</html>
